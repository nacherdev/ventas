<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Clientes')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <main class="container py-4">
        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
        <div th:if="${mensaje}" class="alert alert-success" role="status" th:text="${mensaje}"></div>
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
            <h1 class="h2 mb-0">Clientes</h1>
            <a class="btn btn-primary" th:href="@{/clientes/crear}">Crear cliente</a>
        </div>
        <form class="row g-2 align-items-end mb-4" th:action="@{/clientes}" method="get">
            <div class="col-sm-6 col-md-4">
                <label class="form-label" for="ciudad">Filtrar por ciudad</label>
                <input class="form-control" id="ciudad" name="ciudad" type="text"
                       placeholder="Introduce una ciudad" th:value="${ciudad}">
            </div>
            <div class="col-auto">
                <button class="btn btn-outline-primary" type="submit">Filtrar</button>
                <a class="btn btn-outline-secondary" th:href="@{/clientes}">Limpiar</a>
            </div>
        </form>
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                    <tr><th>ID</th><th>Nombre</th><th>Apellido 1</th><th>Apellido 2</th><th>Ciudad</th><th>Categoría</th><th>Acciones</th></tr>
                </thead>
                <tbody>
                    <tr th:each="cliente : ${clientes}">
                        <td th:text="${cliente.id}">0</td>
                        <td th:text="${cliente.nombre}">nombre</td>
                        <td th:text="${cliente.apellido1}">apellido1</td>
                        <td th:text="${cliente.apellido2 ?: '-'}">apellido2</td>
                        <td th:text="${cliente.ciudad}">ciudad</td>
                        <td th:text="${cliente.categoría}">categoría</td>
                        <td>
                            <div class="d-flex flex-wrap gap-2">
                                <form th:action="@{/clientes/{id}(id=${cliente.id})}" method="get"><button class="btn btn-sm btn-outline-primary" type="submit">Ver detalle</button></form>
                                <form th:action="@{/clientes/editar/{id}(id=${cliente.id})}" method="get"><button class="btn btn-sm btn-outline-secondary" type="submit">Editar</button></form>
                                <form th:action="@{/clientes/borrar/{id}(id=${cliente.id})}" method="post"><button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button></form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
