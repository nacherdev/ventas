<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Editar pedido')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <main class="container py-4" style="max-width: 720px">
        <h1 class="h2 mb-4">Editar pedido</h1>
        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
        <form th:action="@{/pedidos/editar/{id}(id=${pedido.id})}" th:object="${pedido}" method="post">
            <div class="mb-3">
                <label class="form-label" for="id">ID</label>
                <input class="form-control" id="id" th:field="*{id}" readonly>
            </div>
            <div class="mb-3">
                <label class="form-label" for="total">Total</label>
                <input class="form-control" id="total" type="number" step="any" th:field="*{total}" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="fecha">Fecha</label>
                <input class="form-control" id="fecha" type="date" th:field="*{fecha}">
            </div>
            <div class="mb-3">
                <label class="form-label" for="clienteId">Cliente</label>
                <select class="form-select" id="clienteId" th:field="*{clienteId}" required>
                    <option value="">Selecciona un cliente</option>
                    <option th:each="cliente : ${clientes}" th:value="${cliente.id}"
                            th:text="${cliente.nombre + ' ' + cliente.apellido1 + (cliente.apellido2 != null ? ' ' + cliente.apellido2 : '')}"></option>
                </select>
            </div>
            <div class="mb-4">
                <label class="form-label" for="comercialId">Comercial</label>
                <select class="form-select" id="comercialId" th:field="*{comercialId}" required>
                    <option value="">Selecciona un comercial</option>
                    <option th:each="comercial : ${comerciales}" th:value="${comercial.id}"
                            th:text="${comercial.nombre + ' ' + comercial.apellido1 + (comercial.apellido2 != null ? ' ' + comercial.apellido2 : '')}"></option>
                </select>
            </div>
            <button class="btn btn-primary" type="submit">Guardar</button>
            <a class="btn btn-outline-secondary ms-2" th:href="@{/pedidos}">Cancelar</a>
        </form>
    </main>
</body>
</html>
