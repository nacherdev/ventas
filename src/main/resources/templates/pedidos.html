<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pedidos')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <main class="container py-4">
        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
        <div th:if="${mensaje}" class="alert alert-success" role="status" th:text="${mensaje}"></div>
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
            <h1 class="h2 mb-0">Pedidos</h1>
            <a class="btn btn-primary" th:href="@{/pedidos/crear}">Crear pedido</a>
        </div>
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                    <tr><th>ID</th><th>Total</th><th>Fecha</th><th>Cliente</th><th>Comercial</th><th>Acciones</th></tr>
                </thead>
                <tbody>
                    <tr th:each="pedido : ${pedidos}">
                        <td th:text="${pedido.id}">0</td>
                        <td th:text="${pedido.total}">0.00</td>
                        <td th:text="${pedido.fecha ?: '-'}">fecha</td>
                        <td th:text="${pedido.clienteNombre}">cliente</td>
                        <td th:text="${pedido.comercialNombre}">comercial</td>
                        <td>
                            <div class="d-flex flex-wrap gap-2">
                                <a class="btn btn-sm btn-outline-primary" th:href="@{/pedidos/{id}(id=${pedido.id})}">Ver detalle</a>
                                <a class="btn btn-sm btn-outline-secondary" th:href="@{/pedidos/editar/{id}(id=${pedido.id})}">Editar</a>
                                <form th:action="@{/pedidos/borrar/{id}(id=${pedido.id})}" method="post">
                                    <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(pedidos)}"><td colspan="6" class="text-center">No hay pedidos.</td></tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
