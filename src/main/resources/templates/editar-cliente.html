<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Editar cliente')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <main class="container py-4" style="max-width: 720px">
        <h1 class="h2 mb-4">Editar cliente</h1>
        <div th:if="${mensaje}" class="alert alert-success" role="alert" th:text="${mensaje}"></div>
        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
        <form th:action="@{/clientes/editar/{id}(id=${cliente.id})}" th:object="${cliente}" method="post">
            <div class="mb-3"><label class="form-label" for="id">ID</label><input class="form-control" id="id" th:field="*{id}" readonly></div>
            <div class="mb-3"><label class="form-label" for="nombre">Nombre</label><input class="form-control" id="nombre" th:field="*{nombre}" required></div>
            <div class="mb-3"><label class="form-label" for="apellido1">Apellido 1</label><input class="form-control" id="apellido1" th:field="*{apellido1}" required></div>
            <div class="mb-3"><label class="form-label" for="apellido2">Apellido 2</label><input class="form-control" id="apellido2" th:field="*{apellido2}"></div>
            <div class="mb-3"><label class="form-label" for="ciudad">Ciudad</label><input class="form-control" id="ciudad" th:field="*{ciudad}"></div>
            <div class="mb-4"><label class="form-label" for="categoría">Categoría</label><input class="form-control" id="categoría" type="number" th:field="*{categoría}"></div>
            <button class="btn btn-primary" type="submit">Guardar</button>
            <a class="btn btn-outline-secondary ms-2" th:href="@{/clientes}">Cancelar</a>
        </form>

        <section class="mt-5">
            <h2 class="h4 mb-3">Añadir comercial</h2>
            <form class="card card-body mb-4"
                  th:action="@{/clientes/editar/{id}/comerciales(id=${cliente.id})}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="comercialId">Comercial</label>
                    <select class="form-select" id="comercialId" name="comercialId" required>
                        <option value="" selected disabled>Selecciona un comercial</option>
                        <option th:each="comercial : ${comercialesDisponibles}"
                                th:value="${comercial.id}"
                                th:text="${comercial.nombre + ' ' + comercial.apellido1 + (comercial.apellido2 == null ? '' : ' ' + comercial.apellido2)}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="fechaVinculo">Fecha</label>
                    <input class="form-control" id="fechaVinculo" name="fecha" type="date" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="prioridad">Prioridad</label>
                    <input class="form-control" id="prioridad" name="prioridad" type="number" min="0" step="1" required>
                </div>
                <div>
                    <button class="btn btn-success" type="submit">Añadir Comercial</button>
                </div>
            </form>

            <h2 class="h4 mb-3">Comerciales vinculados</h2>
            <p th:if="${#lists.isEmpty(comercialesVinculados)}" class="text-muted">
                Este cliente todavía no tiene comerciales vinculados.
            </p>
            <div class="table-responsive" th:unless="${#lists.isEmpty(comercialesVinculados)}">
                <table class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th>Comercial</th>
                            <th>Fecha</th>
                            <th>Prioridad</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="vinculo : ${comercialesVinculados}">
                            <td th:text="${vinculo.comercialNombre + ' ' + vinculo.comercialApellido1 + (vinculo.comercialApellido2 == null ? '' : ' ' + vinculo.comercialApellido2)}"></td>
                            <td th:text="${vinculo.fecha}"></td>
                            <td th:text="${vinculo.prioridad}"></td>
                            <td>
                                <form th:action="@{/clientes/editar/{id}/comerciales/{comercialId}/borrar(id=${cliente.id}, comercialId=${vinculo.comercialId})}"
                                      method="post">
                                    <button class="btn btn-outline-danger btn-sm" type="submit">Borrar</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
